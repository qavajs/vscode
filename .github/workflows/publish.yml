name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run copy-wasms
      - run: npm run vsce
      - name: publish to marketplace
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}
